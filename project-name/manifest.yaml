apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-name
  labels:
    app: project-name
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-name
  template:
    metadata:
      labels:
        app: project-name
    spec:
      containers:
        - name: project-name
          image: your-registry/project-name:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: deployed
            - name: SERVICE_NAME
              value: project-name
            - name: KEYVAULT_URL
              valueFrom:
                secretKeyRef:
                  name: project-name-secrets
                  key: keyvault-url
            - name: JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: project-name-secrets
                  key: jwt-audience
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: project-name-secrets
                  key: jwt-issuer
          readinessProbe:
            httpGet:
              path: /api/sample/health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/sample/health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: project-name
spec:
  selector:
    app: project-name
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
